<!DOCTYPE html>
<html lang="en">

	<head>
		<meta content="width=device-width, initial-scale=1" charset="utf-8" />

        <title>
            Cool Spots
        </title>

        
		<link rel="stylesheet" type="text/css" href="/references/styles/style.css">
        <link rel="stylesheet" type="text/css" href="/references/styles/spots.css">

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">
        <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
	</head>
<body>

    <div id="map"></div>

    <div id="map-buttons">
        <div id="legend">
            <ul>
                <li><img src="/images/marker.svg"> Text 1</li>
                <li><img src="/images/marker.svg"> Text 1</li>
                <li><img src="/images/marker.svg"> Text 1</li>
                <li><img src="/images/marker.svg"> Text 1</li>
            </ul>
        </div>

        
        <button>
            Info
        </button>

        <label>
            Marker color shows:
            <select onchange="redrawMarkers()" id="marker-color-shows">
                <option value="type">Type</option> <!-- place, road-->
                <option value="rating">Rating</option>
                <option value="activity">Best Activity</option>
            </select>
        </label>
        <div class="check-box-box">
            <label class="check-box"> <!-- unfortunately seems theres no way to style checkboxes without a custom class -->
                <input type="checkbox">
                Show Good
            </label>
            <label class="check-box">
                <input type="checkbox">
                Show Fine
            </label>
            <label class="check-box">
                <input type="checkbox">
                Show Bad
            </label>
            <label class="check-box">
                <input type="checkbox">
                Show Unexplored
            </label>
        </div>
        <div class="check-box-box">
            <label class="check-box">
                <input type="checkbox">
                Food
            </label>
            <label class="check-box">
                <input type="checkbox">
                Driving
            </label>
            <label class="check-box">
                <input type="checkbox">
                Biking
            </label>
            <label class="check-box">
                <input type="checkbox">
                Hiking
            </label>
            <label class="check-box">
                <input type="checkbox">
                Fishing
            </label>
        </div>
    </div>

    <div id="sidebar">
        <button onclick="closeSidebar()">
            Close
        </button>

        <br>
        <br>
        <br>

        <h1 id="sidebar-name" class="sidebar-section">Header</h1>
        <p id="sidebar-rating" class="sidebar-section">rating</p>
        <p id="sidebar-description" class="sidebar-section">description text</p>
        <p id="sidebar-coords" class="sidebar-section">coords</p>
        <p id="sidebar-type" class="sidebar-section">type</p>
        <p id="sidebar-activities" class="sidebar-section">activities</p>
        <p id="sidebar-date" class="sidebar-section">date</p>

    </div>

    <script src="/references/scripts/spots.js" defer></script>
    <script>
        
    </script>
</body>
</html>
