<!DOCTYPE html>
<html>
	<head>
		<meta content="width=device-width, initial-scale=1" charset="utf-8"/>

        <title>
            Style Tester
        </title>

		<link rel="stylesheet" type="text/css" href="/references/styles/style.css">

        <!-- jquery needed to load html into other html -->
		<script src="https://code.jquery.com/jquery-3.3.1.js" integrity="sha256-2Kok7MbOyxpgUVvAk/HJ2jigOSYS2auK4Pfzbm7uH60=" crossorigin="anonymous"></script>
        <script src="/references/scripts/load.js"></script>
	</head>
	<body>
        <div id="image-viewer"></div>    

		<div id="main">
			<h1>
				Heading 1
			</h1>
            <h2>
				Heading 2
			</h2>
            <h3>
				Heading 3
			</h3>
            <h4>
				Heading 4
			</h4>

			<p>
				This is a paragraph. next element is hr
			</p>

            <hr>

            <button>
                button
            </button>
			
            <label>
                <select>
                    <option value="1">val 1</option> <!--Place, Road, Trail - last two will probably match up with driving and hiking/biking-->
                    <option value="2">val 2</option>
                    <option value="3">val 3</option>
                </select>
            </label>

            <label class="check-box"> <!-- unfortunately seems theres no way to style checkboxes without a custom class -->
                <input type="checkbox">
                <span class="checkmark"></span>
                checkbox
            </label>

            <img src="/images/portfolio/IMG_8992.jpg" class="viewable-image" width="100px !important">

			<div id="footer"></div>
		</div>

		<div id="navbar"></div>
	</body>

    <!-- necessary scripts for modules that jquery loads -->
    <script src="/references/scripts/imageViewer.js"></script>
    <script src="/references/scripts/navbar.js"></script>
</html>
